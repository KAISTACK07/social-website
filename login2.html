<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="l2styles.css">
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop>
            <source src="/Users/dupinder/Desktop/3121327-uhd_3840_2160_24fps.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <div class="container">
        <div class="login-signup">
            <input type="radio" name="tab" id="login-tab" checked>
            <input type="radio" name="tab" id="signup-tab">
            
            <div class="tabs">
                <label for="login-tab" class="tab">Login</label>
                <label for="signup-tab" class="tab">Sign Up</label>
            </div>

            <div class="forms">
                <div class="login-form form">
                    <h2>Login</h2>
                    <form>
                        <input type="text" placeholder="Username" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit"><a href="./project.html">Login</a></button>
                    </form>
                </div>
                <div class="signup-form form">
                    <h2>Sign Up</h2>
                    <form>
                        <input type="text" placeholder="Username" required>
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
